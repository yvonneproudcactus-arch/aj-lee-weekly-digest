name: Weekly AJ Lee Real Estate Digest

on:
     schedule:
       # 21:17 UTC Sunday ≈ 7:17am AEST / 8:17am AEDT Monday in Melbourne.
       # Deliberately off the round hour (not :00) — GitHub Actions cron is
       # "best effort" and can silently skip triggers during high load,
       # which is most common right on the hour. Off-hour minutes queue
       # more reliably. Shift by 1 hour around daylight saving changes
       # (early Oct and early Apr) if you want it to land at exactly
       # 7am local year-round.
       - cron: "17 21 * * 0"
     workflow_dispatch: {} # lets you click "Run workflow" in the Actions tab to test manually

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Generate and send digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: npm run digest
